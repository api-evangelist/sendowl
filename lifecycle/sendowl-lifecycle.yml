versioning:
  scheme: uri-path
  current: v1
  docs: https://dashboard.sendowl.com/developers/api/introduction
  note: >-
    SendOwl versions PER RESOURCE inside one base URL rather than versioning the API as a whole. The
    documented current path prefix differs by resource, and each resource page carries its own version
    history table. Older prefixes remain served — the /api/v1 endpoints for products, subscriptions,
    licenses and drip items are current, not legacy.
  resource_versions:
  - resource: products
    path_prefix: /api/v1
    history:
    - version: '1.2'
      change: Address fields separated into billing and shipping address fields
    - version: '1.1'
      change: No changes — version change for other endpoints
    - version: '1.0'
      change: Initial release
  - resource: bundles (packages)
    path_prefix: /api/v1
    history:
    - version: '1.2'
      change: Address fields separated into billing and shipping address fields
    - version: '1.1'
      change: No changes — version change for other endpoints
    - version: '1.0'
      change: Initial release
  - resource: subscriptions
    path_prefix: /api/v1
    history:
    - version: '1.3'
      change: frequency replaced with frequency_interval and frequency_value for more granular
        configuration; interval constants updated
    - version: '1.2'
      change: Address fields separated into billing and shipping address fields
    - version: '1.1'
      change: No changes — version change for other endpoints
    - version: '1.0'
      change: Initial release
  - resource: discounts
    path_prefix: /api/v1_2
    history:
    - version: '1.2'
      change: Discount codes and product limits separated into their own endpoints and no longer
        appear in the discount payload
    - version: '1.1'
      change: Preferred endpoint URLs updated from /discount_codes to /discounts; payloads renamed to
        'discounts'; discounts can be limited to specific products/bundles through the API
    - version: '1.0'
      change: Initial release — payloads named 'discount_codes'
  - resource: orders
    path_prefix: /api/v1_3
    history:
    - version: '1.3'
      change: Current documented order endpoints (index, search, show, update, access grant/revoke)
    - version: '1.0'
      change: Initial release; refund, cancel_subscription, resend_email, download_restrictions and
        override_country remain documented at /api/v1
  - resource: drip_items
    path_prefix: /api/v1
    history:
    - version: '1.0'
      change: Initial release
  - resource: licenses
    path_prefix: /api/v1
    history:
    - version: '1.0'
      change: Initial release
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  note: >-
    No deprecation policy, sunset window, Deprecation/Sunset header support (RFC 8594) or end-of-life
    schedule is published for any API version. The only breaking-change signal available to a consumer
    is the per-resource version history table on each reference page, which is undated. Because there
    is no published policy, no `Deprecation` pointer is emitted.
  renamed_surfaces:
  - from: packages
    to: bundles
    note: '"Please note bundles used to be called packages and the API urls still use this term" —
      the product renamed but the API path did not, and no alias was added.'
  - from: /discount_codes
    to: /discounts
    note: Endpoint URLs changed at version 1.1; the old naming is documented as superseded.

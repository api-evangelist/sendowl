aid: sendowl
name: SendOwl
description: SendOwl is a UK-based digital commerce platform that lets creators and small businesses
  sell digital products, subscriptions, memberships, license keys, drip-delivered courses and physical
  goods, with hosted checkout, automated file delivery, PDF stamping, affiliate programs, discount
  codes and EU VAT handling. It exposes a public REST API at api.sendowl.com covering products,
  bundles (packages), subscriptions, drip items, orders, discounts and licenses in both JSON and XML,
  authenticated with HTTP Basic using an account API key and secret, alongside an outbound webhook
  surface signed with HMAC-SHA256 and a browser-side sendowl.js library that drives the lightbox
  checkout and cart widget.

apis:
- aid: sendowl:sendowl-api
  name: SendOwl API
  description: The SendOwl REST API provides third-party applications access to a merchant account's
    products, bundles (packages), subscriptions, drip items, orders, discounts, discount codes and
    license keys. Requests and responses are available in both JSON and XML selected via the Accept
    header, index actions are paginated with page/per_page (max 50), and authorization uses HTTP
    Basic with the API key and secret generated in the SendOwl dashboard.

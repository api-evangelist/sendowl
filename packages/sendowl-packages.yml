note: >-
  SendOwl publishes NO first-party client library for its REST API in any package registry. The API
  reference says only "We have just started a GitHub repos with code samples for different langagues"
  and links github.com/SendOwl/community-code — sample code, not a versioned, installable SDK. The
  SendOwl GitHub organization holds 17 public repositories, of which 16 are forks of third-party Ruby
  gems used internally (paperclip, mimemagic, paypal-express, imgix-rails, createsend-ruby,
  mailerlite-ruby, php-serialize, forceps, omniauth-instagram, slate-serializers and similar) and one
  is the community sample-code repo. Because no first-party API client library exists, NO `SDKs`
  pointer is emitted for this provider — the only first-party distributable is the browser-side
  sendowl.js checkout library, which is a UI/checkout component (see components/) rather than an API
  client. Everything installable that wraps the SendOwl REST API is third-party and unmaintained: the
  newest such package was last published in January 2023 and the two actual API wrappers were last
  published in 2022 and 2017.

    less"]]'
  xml: '<errors><error>Attachment must be present or test mode switched on</error></errors>'
  content_types:
  - application/json
  - text/xml
problems:
- status: 200
  title: Success
  detail: Returned on successful read, update and delete operations.
  source_doc: https://dashboard.sendowl.com/developers/api/products
- status: 201
  title: Created
  detail: Returned on successful create; the Location header points at the created resource (drip
    items set Location to the associated product or subscription).
  source_doc: https://dashboard.sendowl.com/developers/api/drip_items
- status: 400
  title: Invalid option
  detail: 'Documented on POST /api/v1/orders/{order_id}/resend_email when the `type` parameter is not
    one of "order", "transactions" or "all".'
  source_doc: https://dashboard.sendowl.com/developers/api/orders
- status: 409
  title: Conflict — subscription not in a cancellable state
  detail: Documented on PUT /api/v1/orders/{order_id}/cancel_subscription when the subscription cannot
    be cancelled from its current state.
  remediation: Read the order/subscription state before cancelling; do not retry blindly.
  source_doc: https://dashboard.sendowl.com/developers/api/orders
- status: 415
  title: Unsupported media type — Accept header missing or unsupported
  detail: 'Observed live on https://api.sendowl.com/api/v1/products with no Accept header. Body:
    "Please specify a supported `Accept` header. Valid options: `application/json`,
    `application/xml`".'
  remediation: 'Always send Accept: application/json (and Content-Type on writes).'
  method: probed
  source_doc: https://api.sendowl.com/api/v1/products
- status: 422
  title: Unprocessable entity — validation failure
  detail: >-
    "Should a call use an invalid attribute, not specify all the required fields (on create) or specify
    a field that fails a validation, a 422 status code will be returned with an explanation of the
    reason for failure." This is the primary error status across every documented write endpoint
    (products, bundles, subscriptions, drip items, discounts, licenses, orders).
  remediation: Read the [field, message] pairs and correct the request; do not retry unchanged.
  source_doc: https://dashboard.sendowl.com/developers/api/introduction

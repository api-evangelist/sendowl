rfc9457: false
note: >-
  SendOwl publishes no OpenAPI, so this catalog is read directly from the documented status codes and
  error payloads on the API reference pages rather than derived from a spec. Errors are not RFC 9457
  problem+json: the JSON form is an array of [field, message] pairs and the XML form is an <errors>
  list of sentences. There is no stable machine-readable error code, type URI, or documentation link,
  so agent-side branching has to match on field name and message text.

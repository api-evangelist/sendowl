  codes:
  - code: product_sold_out
    meaning: The product is not purchasable because it is sold out.
  - code: multiple_currencies_not_permitted
    meaning: An attempt was made to add an item of one currency to a cart already containing another
      currency.
  - code: not_found
    meaning: The specified product/bundle cannot be found — check the ID and purchase key.
  - code: single_quantity_item_limit
    meaning: The specified product cannot be added to the cart more than once.
  - code: gateway_setup_error
    meaning: The seller has an invalid payment gateway setup.
  - code: general_error
    meaning: Generic failure — contact SendOwl support.
gaps:
- No error code registry for the REST API (only free-text messages).
- No 401/403 documentation for bad or unpermitted API credentials.
- No documented 429; the stated consequence of exceeding ~1 req/sec is an IP block.
